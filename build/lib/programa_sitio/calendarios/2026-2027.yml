# Calendario Escolar 2026-2027 de la Universidad Autónoma Metropolitana.
# Aprobado por el Colegio Académico en su sesión número 576, celebrada el 26 de febrero
# de 2026. Transcrito de la imagen oficial «Calendario escolar UAM 2026-2027».
#
# Se actualiza una vez al año (un archivo nuevo por año escolar) o cuando el Colegio
# Académico modifique el vigente. Mientras una versión nueva del motor no lo incluya,
# un curso puede usar su propia copia corregida con `calendario: {archivo: …}` en
# curso.yml.
#
# Fechas en formato AAAA-MM-DD. Los rangos son [primer día, último día], inclusive.

calendario: Calendario Escolar 2026-2027
aprobacion: >-
  Aprobado por el Colegio Académico en su sesión número 576 celebrada el día 26 de
