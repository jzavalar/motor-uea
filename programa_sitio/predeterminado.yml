# Configuración predeterminada del motor. Cada UEA la ajusta en su curso.yml, que se
# combina con esta: un diccionario del curso se mezcla con el de aquí clave por clave;
# una lista o un valor del curso reemplaza al de aquí. Todo lo que no se diga en
# curso.yml se toma de este archivo, que describe la estructura común de un programa
# analítico de la UAM con aprendizaje basado en proyectos.

# Archivo de la fuente, relativo a la raíz del repositorio del curso. Se publica tal
# cual como una página del sitio.
fuente: docs/curso/programa-analitico.md

# Datos que solo necesita el sitio y que no tienen lugar en un programa analítico
# formal (texto de apoyo, anclas, etiquetas). Ruta a un YAML o diccionario en línea.
datos: {}

# Carpeta con las plantillas propias del curso (se buscan antes que las del motor).
plantillas: fuente/plantillas

# Datos del sitio que no están en la fuente (si están en la fuente, gana la fuente).
sitio:
  url: null
  repositorio: null
  unidad_corta: null

# ---------------------------------------------------------------- §1 identificación
identificacion:
  seccion: "1"
  columnas: [Campo, Contenido]
  # nombre interno -> texto de la columna Campo (basta con el principio del texto)
  campos:
    nombre: Unidad de enseñanza-aprendizaje
    clave: Clave
    plan: Plan de estudios
    division: División
    profesor: Profesor
    correo: Correo de contacto
    mensajeria: Mensajería
    sitio: Sitio del curso
    repositorio: Repositorio
    trimestre_lectivo: Trimestre lectivo
    periodo_clases: Periodo de clases
    globales: Evaluaciones globales
    horario: Horario
    modalidad: Modalidad de conducción
  obligatorios: [nombre, clave, profesor, correo, trimestre_lectivo, periodo_clases]

# ------------------------------------------------------------------- vocabulario
vocabulario:
  # Texto de la columna IAG de las tablas de sesiones -> código interno
  iag:
    "No": "no"
    "No permitido": "no"
    "Sí, con bitácora": si
    "Sí": si
    "Obligatorio, con bitácora": si
    "Demostración del profesor": demo
    "—": na
    "": na
  descanso: Descanso obligatorio
  holgura: '^Holgura (\d+)$'
  # Fase en que se entrega el expediente y se aplica la evaluación escrita. Si no se
  # dice, es la última fase de la tabla de fases.
  fase_entrega: null

# Cómo se escribe cada código de IAG en las páginas generadas.
ia_etiquetas:
  programa: {"no": "No permitido", si: "Obligatorio, con bitácora"}
  calendario_programa: {"no": "No", si: "Sí, con bitácora", demo: "Demostración del profesor", na: "—"}
  calendario_sitio: {"no": "🚫", si: "✅ bitácora", demo: "Demostración del profesor", na: "—"}

# ----------------------------------------------------------- dónde está cada cosa
secciones:
  # Lista con una viñeta por proyecto: «- **P1** síntesis.» (las negritas son opcionales)
  organizacion: Organización por proyectos
  # Tabla de fases del ciclo de aprendizaje (primera columna: nombre de la fase)
  fases: {columnas: [Fase, Actividad]}
  # Encabezado de cada proyecto (sección 6): «6.1 Proyecto P1 · Nombre» o «…P1: Nombre»
  proyectos: '^Proyecto (P\d+)\s*[·:—–-]\s*(.+?)\s*$'
  calendario: {columnas: [Núm., Fecha, Bloque, Fase, Actividad, IAG]}
  componentes: {columnas: [Componente, Ponderación]}
  lecturas: {columnas: [Clave, Título, Temas, Sesiones]}

# ------------------------------------------------------------------- proyectos
proyecto:
  # Párrafos que empiezan con estas etiquetas en negritas (expresiones regulares,
  # sin distinguir mayúsculas)
  etiquetas:
    proposito: '^Propósito'
    condiciones: '^(Condiciones|Insumo)'
    expediente: '^(Expediente|Contenido del expediente)'
    evaluacion: '^(Evaluación|Examen) escrit[ao]'
    criterios: '^Criterios (específicos )?de la rúbrica'
  sesiones: {columnas: [Sesión, Fecha, Fase, Actividad]}
  # Página de cada proyecto: «plantilla» (la del curso si existe, si no la genérica del
  # motor), «seccion» (la sección 6.N tal cual) o «ninguna».
  pagina: plantilla
  plantilla: "{id}.md.j2"
  destino: "docs/proyectos/{slug}/index.md"
  # Listas del proyecto que se completan, elemento por elemento, con listas de datos
  # (datos.proyectos.<id>.<datos>): [{lista: expediente, datos: expediente_roles, campo: rol}]
  alinear: []
  tablas: {}
  campos: {}
  extraer: {}

# ------------------------------------------------------------------- evaluación
evaluacion:
  escrita: '^(?:Evaluación|Examen) escrit[ao] (\d+)'
  expediente: '^Expedientes?\b'
  ids: {'^Bitácora': bit, '^Participación': par}
  # Oración con la duración de las evaluaciones escritas, si no está en cada proyecto
  duracion: '[Ll]as? evaluaci(?:ón|ones) (?:escritas? )?\d[^.\n]*?\d+ minutos[^.\n]*'

rubrica:
  criterios: 'se califica con (\w+) criterios'
  puntos: 'puntaje máximo es de (\d+) puntos'
  niveles: [insuficiente, suficiente, bueno, excelente]
  comunes: null   # {columnas: [Criterio, ...]} si hay una tabla de criterios comunes

lecturas:
  carpeta: docs/lecturas
  exigir_archivo: false
  apoyo: Apoyo            # clave de las lecturas de apoyo (sin archivo propio)
  sobre_desde: null       # nombre de un diccionario en datos: clave -> descripción corta
  apoyo_desde: null       # nombre de una lista en datos, en el orden de la tabla

# ------------------------------------------------ reglas propias de cada curso
# extraer:  nombre: {patron: 'regex con (?P<grupo>...)', seccion: '5.5', tipos: {grupo: entero},
#                    destino: 'equipos', obligatorio: true}
# tablas:   nombre: {columnas: [...], seccion: '5.5', forma: registros|filas,
#                    columnas_salida: [...], renombrar: {...}, destino: ..., por_proyecto: false}
# listas:   nombre: {despues_de: 'etiqueta' | desde: 'regex', hasta: 'regex', seccion: ...,
#                    patron: 'regex', fijos: {...}, destino: ...}
# validar:  - {que: 'expresión de Jinja', mensaje: 'texto con {{ }}'}
extraer: {}
tablas: {}
listas: {}
validar: []

# --------------------------------------------------------------------- salidas
# Páginas que son secciones de la fuente, tal cual:
#   - {destino: docs/curso/protocolo-ia.md, secciones: ['5.7'], menu: Uso de IA}
paginas: []
# Plantillas del curso -> archivo generado (se suman a las del motor o las reemplazan
# si tienen el mismo destino):
#   docs/curso/calendario.md: sitio/calendario.md.j2
salidas:
  docs/index.md: portada.md.j2
  README.md: README.md.j2
  mkdocs.yml: mkdocs.yml.j2
# Páginas escritas a mano en docs/ que se agregan al menú generado (grupo «Más»)
menu_extra: []
