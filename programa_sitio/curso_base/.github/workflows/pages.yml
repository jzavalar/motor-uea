# Publica el sitio en GitHub Pages en cada push a main.
# Requisito: en GitHub → Settings → Pages → Source, elegir «GitHub Actions»
# (ansible-playbook jzavalar.programa_sitio.nuevo lo deja configurado).
name: Publicar sitio del curso

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar el motor (versión fijada en requirements.txt)
        run: pip install -r requirements.txt

      - name: Comprobar que el sitio del repositorio coincide con la fuente
        id: verificar
        continue-on-error: true
        run: programa-sitio construir --verificar

      - name: Regenerar desde la fuente si el repositorio estaba desactualizado
        if: steps.verificar.outcome == 'failure'
        run: |
          programa-sitio construir
          echo "::warning::El repositorio tenía páginas desactualizadas respecto de la fuente; el sitio publicado se generó desde la fuente. Ejecute ./sitio.sh construir y haga commit para que el repositorio coincida."

      - name: Construir el sitio
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
