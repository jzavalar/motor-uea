[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "programa-sitio"
version = "1.0.0"
description = "Del programa analítico de una UEA (en Markdown) a su sitio web con MkDocs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jesús Zavala Ruiz"}]
dependencies = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "Jinja2>=3.1",
  "PyYAML>=6",
]

[project.optional-dependencies]
pruebas = ["pytest>=7"]

[project.scripts]
programa-sitio = "programa_sitio.cli:main"

[project.entry-points."mkdocs.plugins"]
programa-sitio = "programa_sitio.mkdocs_plugin:ProgramaSitio"

[tool.setuptools]
packages = ["programa_sitio"]

[tool.setuptools.package-data]
programa_sitio = ["predeterminado.yml", "plantillas/*.j2", "curso_base/**/*", "curso_base/*", "curso_base/.*", "curso_base/.*/*", "curso_base/.*/*/*"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
